name: Check status

on:
  # Automatic per-minute scheduling is disabled — monitoring currently runs
  # locally via scripts/run-status-cron.mjs (or scripts/start-status-cron.bat
  # on Windows). To re-enable automatic runs on GitHub, uncomment the
  # schedule block below.
  # schedule:
  #   - cron: "* * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-status
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run status checks
        run: node scripts/check-status.mjs

      - name: Commit and push updated status data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update status data"
          file_pattern: "data/status.json"
          commit_user_name: "status-bot"
          commit_user_email: "actions@github.com"
